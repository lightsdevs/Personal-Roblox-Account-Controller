<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Personal Roblox Account Controller</title>
<style>
:root{color-scheme:dark;--bg:#13171e;--panel:#1c222c;--line:#343d4d;--text:#edf2f9;--muted:#acb8ca;--accent:#86b6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px 'Segoe UI',sans-serif}body.light{color-scheme:light;--bg:#f3f5f9;--panel:#fff;--line:#c9d2df;--text:#172234;--muted:#506079;--accent:#175cb9}header{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 5px}p{color:var(--muted);margin:0;line-height:1.5}main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:24px;padding:24px 28px}section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}h2{font-size:17px;margin:0 0 16px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button,input,textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:10px;background:var(--bg);color:var(--text)}button{cursor:pointer}button:hover:enabled{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:var(--bg);font-weight:600}label{display:block;margin:15px 0 7px}input,textarea{width:100%}textarea{resize:vertical;min-height:95px}#accounts{display:grid;gap:8px;max-height:430px;overflow:auto}.account{text-align:left;padding:14px}.account[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.account strong,.account small{display:block}.account small{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}#status{margin:0 28px 24px;padding:14px;border:1px solid var(--line);border-radius:8px;white-space:pre-wrap}small{color:var(--muted)}.action{margin-top:10px}#selected{color:var(--accent)}@media(max-width:720px){main{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>Personal Roblox Account Controller</h1><p>Your accounts, ready to play.</p></div><button id="theme">Light / dark</button></header>
<main><section><h2>Accounts</h2><div class="row"><button data-op="login" class="primary">Add / sign in again</button><button data-op="import">Import old CSV</button></div><div id="accounts"></div><p id="empty">No accounts yet. Add an account or import your existing CSV.</p><p style="margin-top:18px"><small>Sessions are encrypted for your Windows user. Import leaves the original CSV unchanged.</small></p></section>
<section><h2 id="selected">Select an account</h2><button data-op="browser" data-selection>Open account browser</button>
<label for="place">Place ID</label><input id="place" inputmode="numeric" placeholder="Enter a place ID"><button class="action" data-op="place" data-selection>Join by place ID</button>
<label for="username">Player username</label><input id="username" maxlength="100" placeholder="Username to follow"><button class="action" data-op="user" data-selection>Join by player username</button>
<label for="description">Description</label><textarea id="description" maxlength="10000" placeholder="Add a note for this account"></textarea><button class="action" data-op="description" data-selection>Save description</button></section></main>
<div id="status" role="status" aria-live="polite">Loading accounts...</div>
<script>
let accounts=[], selected=-1, busy=true, blocked=false;
const $=id=>document.getElementById(id);
function send(op,value=''){window.ipc.postMessage(JSON.stringify({op,index:selected<0?null:selected,value}));}
function controls(){document.querySelectorAll('[data-op]').forEach(b=>b.disabled=busy||blocked||(b.hasAttribute('data-selection')&&selected<0));$('description').disabled=busy||blocked||selected<0;}
function select(i){selected=i;$('selected').textContent=accounts[i]?.username||'Select an account';$('description').value=accounts[i]?.description||'';document.querySelectorAll('.account').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));controls();}
window.render=s=>{busy=s.busy;blocked=s.blocked;$('status').textContent=s.message;if(s.accounts){const old=accounts[selected]?.username;accounts=s.accounts;$('accounts').replaceChildren();accounts.forEach((a,i)=>{const b=document.createElement('button');b.className='account';const title=document.createElement('strong');title.textContent=a.username;const note=document.createElement('small');note.textContent=a.description||'No description';b.append(title,note);b.onclick=()=>select(i);$('accounts').append(b);});$('empty').hidden=accounts.length>0;select(accounts.findIndex(a=>a.username===old));}controls();};
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{let op=b.dataset.op;if(op==='import'&&!confirm('Import accounts from accountdata.csv in the original project folder? The CSV will remain unchanged. Existing usernames will be skipped.'))return;send(op,op==='place'?$('place').value:op==='user'?$('username').value:op==='description'?$('description').value:'');});
$('theme').onclick=()=>document.body.classList.toggle('light');controls();send('ready');
</script></body></html>
